# Shared pull_request checks for application repos (e.g. webapp-php).
#
#   jobs:
#     pull-request-checks:
#       permissions:
#         pull-requests: write
#       uses: cartoncloud/actions/.github/workflows/shared-pull-request-checks.yml@v3
#       secrets: inherit

name: Pull Request Checks

on:
  workflow_call:
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: false

jobs:
  branch-commit-ticket-match:
    name: Branch Commit Ticket Match
    permissions:
      pull-requests: write
    uses: ./.github/workflows/branch-commit-ticket-match.yml
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
