# Cursor CLI risk classifier for pull requests (reusable workflow).
#
# Call from application repos, for example:
#
#   name: PR Risk Review
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   jobs:
#     risk-review:
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: cartoncloud/actions/.github/workflows/pr-risk-review.yml@main
#       secrets:
#         CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
#
# Prerequisites on the caller repository:
# - Actions secret: CURSOR_API_KEY (https://cursor.com/docs/cli/reference/authentication)
#
# Classifier model: Cursor Composer 2 (`composer-2`).
#
# Branch protection: GitHub cannot set "1 reviewer for low / 2 for high" per PR in native rules.
# Typical setup: require one approval; github-actions approves low-risk same-repo PRs so one human may suffice.

name: PR Risk Review

on:
  workflow_call:
    secrets:
      CURSOR_API_KEY:
        required: true

concurrency:
  group: risk-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-review:
    if: >
      github.event.pull_request.draft == false
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require Cursor API key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo 'Add repository secret CURSOR_API_KEY (Cursor dashboard API keys).' >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Export PR diff artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" > pr-diff.patch
          gh pr diff "${{ github.event.pull_request.number }}" --name-only > changed-files.txt

      - name: Truncate very large diffs
        run: |
          limit=400000
          size=$(wc -c < pr-diff.patch | tr -d ' ')
          if [ "$size" -gt "$limit" ]; then
            head -c "$limit" pr-diff.patch > pr-diff.truncated.patch
            mv pr-diff.truncated.patch pr-diff.patch
            {
              echo ""
              echo "[diff truncated at ${limit} bytes for agent context; missing lines may hide risk — classifier should not assume low risk solely from visible content]"
            } >> pr-diff.patch
          fi

      - name: Run risk review agent
        id: agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set +e
          agent -p -f --output-format json --model composer-2 "$(cat <<'EOF'
          You classify pull-request risk for a production web application (PHP and related stack).

          Read these workspace files:
          - changed-files.txt (one path per line)
          - pr-diff.patch (unified diff; may end with a note if truncated)

          Assign exactly one risk level for the change set as a whole: low, medium, or high.

          Guidelines:
          - low: user-visible copy only, UI labels/help text, translations, comments, static docs,
            history/audit log messages that do not affect permissions, billing, or security behavior,
            or purely cosmetic presentation with no logic or data changes.
          - high: billing/payments/invoicing/subscriptions/pricing/refunds/credits; authentication,
            authorization, sessions, passwords, tokens, OAuth, roles/permissions; secrets or production
            credentials; changes to how PII or money moves; security-sensitive crypto; external
            integrations or webhooks that affect charging, identity, or regulated data; migrations
            or config that alter financial or auth enforcement.
          - medium: all other code or behavior changes (bug fixes, refactors, APIs, data paths,
            non-financial integrations, performance, tests, build, etc.).

          If you are torn between two levels, choose the higher one. Truncated diffs may omit
          material context; do not output low if uncertainty remains.

          Output format (strict):
          - Respond with a single JSON object only. No markdown, no code fences, no prose before or after.
          - Keys: risk_level (string: "low" | "medium" | "high"), rationale (short string),
            signals (array of short strings naming concrete reasons).

          Example (structure only): {"risk_level":"medium","rationale":"…","signals":["…","…"]}
          EOF
          )" > agent-output.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Cursor agent exited with $status"
            exit "$status"
          fi

      - name: Parse agent JSON
        id: parse
        run: |
          node <<'NODE'
          const fs = require('fs');

          function parseFirstJsonObject(text) {
            const start = text.indexOf('{');
            if (start === -1) {
              throw new Error(`No JSON object in agent result: ${text.slice(0, 500)}`);
            }
            let depth = 0;
            let inStr = false;
            let esc = false;
            for (let j = start; j < text.length; j++) {
              const c = text[j];
              if (inStr) {
                if (esc) esc = false;
                else if (c === '\\') esc = true;
                else if (c === '"') inStr = false;
              } else {
                if (c === '"') inStr = true;
                else if (c === '{') depth++;
                else if (c === '}') {
                  depth--;
                  if (depth === 0) {
                    return JSON.parse(text.slice(start, j + 1));
                  }
                }
              }
            }
            throw new Error(`Invalid JSON payload near: ${text.slice(start, start + 800)}`);
          }

          let outer;
          try {
            outer = JSON.parse(fs.readFileSync('agent-output.json', 'utf8'));
          } catch (e) {
            console.error(`Could not parse agent-output.json: ${e.message}`);
            process.exit(1);
          }

          const text = String(outer.result || '').trim();
          if (!text) {
            console.error('Empty agent result');
            process.exit(1);
          }

          let data;
          try {
            data = parseFirstJsonObject(text);
          } catch (e) {
            console.error(e.message);
            process.exit(1);
          }

          const risk = String(data.risk_level || '').trim().toLowerCase();
          if (!['low', 'medium', 'high'].includes(risk)) {
            console.error(`Invalid risk_level: ${JSON.stringify(data.risk_level)}`);
            process.exit(1);
          }

          fs.writeFileSync('risk.json', `${JSON.stringify(data, null, 2)}\n`, 'utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `risk_level=${risk}\n`, 'utf8');
          NODE

      - name: Ensure risk labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          gh label create "risk: low" --color "2ECC71" --description "PR risk — low" --repo "$repo" 2>/dev/null || true
          gh label create "risk: medium" --color "F1C40F" --description "PR risk — medium" --repo "$repo" 2>/dev/null || true
          gh label create "risk: high" --color "E74C3C" --description "PR risk — high" --repo "$repo" 2>/dev/null || true

      - name: Apply risk labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          RISK=$(jq -r '.risk_level' risk.json)
          DESIRED="risk: ${RISK}"

          action=$(gh pr view "$PR" --json labels | jq -r --arg desired "$DESIRED" '
            [.labels[].name
              | select(. == "risk: low" or . == "risk: medium" or . == "risk: high")]
            | unique
            | if length == 1 and .[0] == $desired then "skip" else "apply" end
          ')

          if [ "$action" = "skip" ]; then
            echo "Risk label already ${DESIRED}; leaving labels unchanged."
            exit 0
          fi

          for L in "risk: low" "risk: medium" "risk: high"; do
            gh pr edit "$PR" --remove-label "$L" 2>/dev/null || true
          done
          gh pr edit "$PR" --add-label "$DESIRED"

      - name: Write sticky risk review comment
        run: |
          node <<'NODE'
          const fs = require('fs');

          const data = JSON.parse(fs.readFileSync('risk.json', 'utf8'));
          const risk = data.risk_level || '';
          const rationale = String(data.rationale || '').trim();
          const signals = Array.isArray(data.signals) ? data.signals : [];

          const lines = [
            '### Automated risk review (Composer 2)',
            '',
            `**Level:** \`risk: ${risk}\``,
            '',
            `**Rationale:** ${rationale}`,
            '',
            '**Signals**',
          ];
          if (signals.length) {
            for (const item of signals) lines.push(`- ${item}`);
          } else {
            lines.push('_None listed_');
          }
          lines.push(
            '',
            '_This is advisory automation; humans remain responsible for merge decisions._',
          );
          fs.writeFileSync('risk-comment.md', `${lines.join('\n')}\n`, 'utf8');
          NODE

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-risk-review
          path: risk-comment.md

      - name: Revoke automated approval when risk is not low
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RISK_LEVEL: ${{ steps.parse.outputs.risk_level }}
          HEAD_REPO_FULL: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.GH_TOKEN;
          const repoFull = process.env.REPO_FULL;
          const prNumber = process.env.PR_NUMBER;
          const risk = process.env.RISK_LEVEL;
          const headRepoFull = process.env.HEAD_REPO_FULL;

          if (headRepoFull !== repoFull) {
            console.log('Skipping approval revocation on fork PRs.');
            process.exit(0);
          }
          if (risk === 'low') process.exit(0);

          const [owner, repo] = repoFull.split('/');
          const baseHeaders = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            Authorization: `Bearer ${token}`,
          };

          async function github(method, path, body) {
            const headers = { ...baseHeaders };
            if (body !== undefined) headers['Content-Type'] = 'application/json';
            const res = await fetch(`https://api.github.com${path}`, {
              method,
              headers,
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            return res;
          }

          async function listReviews() {
            const out = [];
            for (let page = 1; ; page++) {
              const res = await github(
                'GET',
                `/repos/${owner}/${repo}/pulls/${prNumber}/reviews?per_page=100&page=${page}`,
              );
              if (!res.ok) {
                throw new Error(`Failed to list reviews: ${res.status} ${await res.text()}`);
              }
              const batch = await res.json();
              if (!batch.length) break;
              out.push(...batch);
              if (batch.length < 100) break;
            }
            return out;
          }

          function botApprovedIds(reviews) {
            return reviews
              .filter((r) => r.state === 'APPROVED' && r.user?.login === 'github-actions[bot]')
              .map((r) => r.id)
              .sort((a, b) => b - a);
          }

          function countBotApproved(reviews) {
            return reviews.filter(
              (r) => r.state === 'APPROVED' && r.user?.login === 'github-actions[bot]',
            ).length;
          }

          let reviews = await listReviews();
          const before = countBotApproved(reviews);
          if (before === 0) {
            console.log('No automated approvals to revoke.');
            process.exit(0);
          }

          const dismissMessage = `Risk level reassessed as ${risk} (not low); dismissing automated low-risk approval.`;

          for (const rid of botApprovedIds(reviews)) {
            const res = await github(
              'PUT',
              `/repos/${owner}/${repo}/pulls/${prNumber}/reviews/${rid}/dismissals`,
              { message: dismissMessage, event: 'DISMISS' },
            );
            if (res.ok) console.log(`Dismissed review ${rid}`);
            else {
              console.log(
                `::warning title=Dismiss review failed::Could not PUT dismissals for review ${rid}; will try supersede via request-changes if needed.`,
              );
            }
          }

          reviews = await listReviews();
          const after = countBotApproved(reviews);
          if (after === 0) {
            console.log('Automated approvals cleared.');
            process.exit(0);
          }

          console.log(
            'Superseding remaining bot approval via request-changes (dismiss unavailable or insufficient permission).',
          );
          const prRes = await github(
            'GET',
            `/repos/${owner}/${repo}/pulls/${prNumber}`,
          );
          if (!prRes.ok) {
            console.error(`Failed to load PR: ${prRes.status}`);
            process.exit(0);
          }
          const pr = await prRes.json();
          const commitId = pr.head?.sha;
          if (!commitId) {
            console.error('Could not read PR head SHA for request-changes review.');
            process.exit(0);
          }

          const body =
            `Automated reassessment marked this PR as **${risk}** risk (not low). An earlier approve from github-actions bot is superseded by this review.\n\n` +
            '(Used when dismissal of the automated approval fails for your repo or rules.)';

          const rcRes = await github(
            'POST',
            `/repos/${owner}/${repo}/pulls/${prNumber}/reviews`,
            { commit_id: commitId, body, event: 'REQUEST_CHANGES' },
          );
          if (!rcRes.ok) {
            console.error(`request-changes review failed: ${rcRes.status} ${await rcRes.text()}`);
          }
          NODE

      - name: Auto-approve low-risk PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Skipping auto-approve for fork PRs."
            exit 0
          fi
          RISK="${{ steps.parse.outputs.risk_level }}"
          PR="${{ github.event.pull_request.number }}"
          if [ "$RISK" != "low" ]; then
            exit 0
          fi
          if gh pr view "$PR" --json reviewDecision --jq '.reviewDecision == "APPROVED"' | grep -q true; then
            exit 0
          fi
          gh pr review "$PR" --approve --body "Automated low-risk classification (Composer 2 risk review). One human reviewer may still be required by branch protection."
