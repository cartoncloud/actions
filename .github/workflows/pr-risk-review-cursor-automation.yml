# PR risk classifier via Cursor Automation webhook (reusable workflow).
#
# Currently disabled: this workflow exits successfully without side effects.
#
# Call from application repos, for example:
#
#   name: PR Risk Review
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   jobs:
#     risk-review:
#       permissions:
#         contents: read
#       uses: cartoncloud/actions/.github/workflows/pr-risk-review-cursor-automation.yml@v3
#
# To re-enable: restore webhook + marker parsing from git history and update
# pr-risk-review-cursor-automation/AUTOMATION_PROMPT.md in the Cursor automation.

name: PR Risk Review (Cursor Automation)

on:
  workflow_call:

concurrency:
  group: risk-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-review:
    if: >
      github.event.pull_request.draft == false
      && github.actor != 'dependabot[bot]'
      && !startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Risk review disabled
        run: echo "Risk review automation is disabled."
