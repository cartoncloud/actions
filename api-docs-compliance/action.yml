name: 'API Documentation Compliance'
description: 'Checks OpenAPI spec compliance on PRs using the api-spec-contract-review skill from api-documentation.'
inputs:
  PERSONAL_ACCESS_TOKEN:
    description: 'GitHub token with access to the api-documentation repo (if private)'
    required: true
  CURSOR_API_KEY:
    description: 'Cursor API key for bugbot analysis'
    required: true
  API_DOCUMENTATION_REPO:
    description: 'Override for the api-documentation repo (e.g. org/repo)'
    required: false
    default: cartoncloud/api-documentation
  API_DOCUMENTATION_BRANCH:
    description: 'Branch to use for the api-documentation repo (default: main)'
    required: false
    default: main
runs:
  using: composite
  steps:
    - name: Checkout target repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Checkout api-documentation (with branch fallback)
      shell: bash
      env:
        API_DOCUMENTATION_REPO: ${{ inputs.API_DOCUMENTATION_REPO }}
        API_DOCUMENTATION_BRANCH: ${{ inputs.API_DOCUMENTATION_BRANCH }}
        PERSONAL_ACCESS_TOKEN: ${{ inputs.PERSONAL_ACCESS_TOKEN }}
      run: |
        set -e
        REPO="$API_DOCUMENTATION_REPO"
        BRANCH="$API_DOCUMENTATION_BRANCH"
        TOKEN="$PERSONAL_ACCESS_TOKEN"
        TARGET_DIR="api-documentation"
        rm -rf "$TARGET_DIR"
        if [ "$BRANCH" = "main" ]; then
          git clone --depth 1 --branch "$BRANCH" "https://x-access-token:$TOKEN@github.com/$REPO.git" "$TARGET_DIR"
        else
          if git clone --depth 1 --branch "$BRANCH" "https://x-access-token:$TOKEN@github.com/$REPO.git" "$TARGET_DIR"; then
            echo "Checked out branch $BRANCH."
          else
            echo "Branch $BRANCH not found, falling back to main."
            git clone --depth 1 --branch main "https://x-access-token:$TOKEN@github.com/$REPO.git" "$TARGET_DIR"
          fi
        fi

    - name: Clear previous API spec bugbot comments
      uses: aki77/delete-pr-comments-action@v3
      with:
        token: ${{ inputs.PERSONAL_ACCESS_TOKEN }}
        pullRequestNumber: ${{ github.event.pull_request.number }}
        includeIssueComments: 'true'
        includeOverallReviewComments: 'true'
        bodyContains: |-
          API spec review
          API Documentation Compliance
        usernames: |-
          cartoncloud-robot
          github-actions[bot]

    - name: Prepare API spec contract review skill and OpenAPI spec
      shell: bash
      run: |
        set -euo pipefail
        SKILL_SRC="api-documentation/.cursor/skills/api-spec-contract-review"
        if [ ! -d "$SKILL_SRC" ]; then
          echo "::error::Expected skill directory missing: $SKILL_SRC (api-documentation repo may have restructured)." >&2
          exit 1
        fi
        mkdir -p .cursor/skills
        cp -r "$SKILL_SRC" .cursor/skills/
        # Merge canonical spec into openapi/ so it ends up at openapi/index.yml even when repo already has openapi/
        mkdir -p openapi
        if [ ! -d api-documentation/openapi ]; then
          echo "::error::Expected openapi/ missing under api-documentation clone." >&2
          exit 1
        fi
        rsync -a api-documentation/openapi/ openapi/
        for required in \
          ".cursor/skills/api-spec-contract-review/SKILL.md" \
          "openapi/index.yml"; do
          if [ ! -f "$required" ]; then
            echo "::error::Required file missing after prepare: $required" >&2
            exit 1
          fi
        done

    - name: Install Cursor CLI
      shell: bash
      run: |
        curl https://cursor.com/install -fsSL | bash
        echo "$HOME/.cursor/bin" >> $GITHUB_PATH
        echo "CURSOR_BIN=$HOME/.cursor/bin" >> $GITHUB_ENV

    - name: Run OpenAPI spec contract review (Cursor CLI)
      id: bugbot
      shell: bash
      env:
        CURSOR_API_KEY: ${{ inputs.CURSOR_API_KEY }}
        GH_TOKEN: ${{ inputs.PERSONAL_ACCESS_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUM: ${{ github.event.pull_request.number }}
        MODEL: kimi-k2.5
      run: |
        set -euo pipefail
        export PATH="${CURSOR_BIN:-$HOME/.cursor/bin}:$PATH"
        for required in \
          ".cursor/skills/api-spec-contract-review/SKILL.md" \
          "openapi/index.yml"; do
          if [ ! -f "$required" ]; then
            echo "::error::Missing $required — run the Prepare step successfully or fix api-documentation layout." >&2
            exit 1
          fi
        done
        CHANGED_FILES=$(gh pr diff "$PR_NUM" --name-only 2>/dev/null | head -100 || true)
        PROMPT="/api-spec-contract-review

        Files changed in this PR (review only these):
        ${CHANGED_FILES}

        If no violations are found, output only a single line containing COMPLIANT_NO_VIOLATIONS with no Markdown formatting or explanation.
        If violations are found, output the full review to stdout and do not put COMPLIANT_NO_VIOLATIONS anywhere in the output."
        agent --print --output-format=text --model "$MODEL" --trust --workspace "$GITHUB_WORKSPACE" -- "$PROMPT" > /tmp/bugbot-output.txt 2>/tmp/bugbot-stderr.txt || true
        [ -s /tmp/bugbot-stderr.txt ] && cat /tmp/bugbot-stderr.txt >&2 || true

    # Body-only review: GitHub returns 422 "Line could not be resolved" for inline comments when
    # `line` is not part of the PR diff (e.g. hardcoded line: 1 on unchanged context).
    - name: Create pull request review when violations found
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.PERSONAL_ACCESS_TOKEN }}
        PR_NUM: ${{ github.event.pull_request.number }}
      run: |
        set -e
        # Compliant when COMPLIANT_NO_VIOLATIONS appears on its own line, allowing harmless
        # Markdown wrapping in case the model formats the sentinel despite the prompt.
        compliant=
        if [ -f /tmp/bugbot-output.txt ] && tr -d '\r' < /tmp/bugbot-output.txt | awk '
          /^[[:space:]]*$/ { next }
          { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
            gsub(/^[`*_]+|[`*_]+$/, "", $0)
            if ($0 == "COMPLIANT_NO_VIOLATIONS") { found=1; exit }
          }
          END { exit !found }
        '; then
          compliant=1
        fi
        if [ -n "$compliant" ]; then
          echo "API spec check passed (COMPLIANT_NO_VIOLATIONS). No review posted."
          exit 0
        fi
        if [ ! -s /tmp/bugbot-output.txt ]; then
          echo "Contract review produced no output; posting review to request re-run or log check."
          BODY="**API spec review (API Documentation Compliance).** Contract review produced no output. This may indicate agent timeout, no matching changed files, or a CLI error. Please check the workflow logs for the 'Run OpenAPI spec contract review' step and re-run the workflow if needed."
          jq -n --arg body "$BODY" '{event: "COMMENT", body: $body}' > /tmp/review.json
          gh api "repos/${{ github.repository }}/pulls/$PR_NUM/reviews" --method POST --input /tmp/review.json
          exit 0
        fi
        PREFIX="**API spec review (API Documentation Compliance).** Resolve this conversation when all findings below are addressed.

        "
        jq -n \
          --rawfile report /tmp/bugbot-output.txt \
          --arg prefix "$PREFIX" \
          '{event: "COMMENT", body: ($prefix + $report)}' > /tmp/review.json
        gh api "repos/${{ github.repository }}/pulls/$PR_NUM/reviews" --method POST --input /tmp/review.json
        echo "Pull request review posted (body-only; avoids GitHub 422 on unresolved line)."
