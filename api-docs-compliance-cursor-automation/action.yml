name: 'API Documentation Compliance (Cursor Automation)'
description: 'Checks OpenAPI spec compliance on PRs via Cursor cloud automation webhook; posts human-facing PR reviews from parsed marker output.'
inputs:
  API_DOCUMENTATION_REPO:
    description: 'api-documentation repo the automation should use (e.g. org/repo)'
    required: false
    default: cartoncloud/api-documentation
  API_DOCUMENTATION_BRANCH:
    description: 'Branch of api-documentation to use (callers typically pass head_ref)'
    required: false
    default: main
  API_DOCS_COMPLIANCE_WEBHOOK_URL:
    description: 'Full Cursor automation webhook URL (caller passes from secrets via with:)'
    required: true
  API_DOCS_COMPLIANCE_WEBHOOK_TOKEN:
    description: 'Cursor automation webhook bearer token (caller passes from secrets via with:)'
    required: true
runs:
  using: composite
  steps:
    - name: Require Cursor automation webhook token
      shell: bash
      env:
        API_DOCS_COMPLIANCE_WEBHOOK_TOKEN: ${{ inputs.API_DOCS_COMPLIANCE_WEBHOOK_TOKEN }}
      run: |
        if [ -z "$API_DOCS_COMPLIANCE_WEBHOOK_TOKEN" ]; then
          echo 'Pass API_DOCS_COMPLIANCE_WEBHOOK_TOKEN via action with: (e.g. from organisation or repository secrets at workflow level).' >&2
          exit 1
        fi

    - name: Require Cursor automation webhook URL
      shell: bash
      env:
        API_DOCS_COMPLIANCE_WEBHOOK_URL: ${{ inputs.API_DOCS_COMPLIANCE_WEBHOOK_URL }}
      run: |
        if [ -z "$API_DOCS_COMPLIANCE_WEBHOOK_URL" ]; then
          echo 'Pass API_DOCS_COMPLIANCE_WEBHOOK_URL via action with: (e.g. from organisation or repository secrets at workflow level).' >&2
          exit 1
        fi

    - name: Decide whether to run
      id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        EVENT_NAME: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.event.after }}
      run: |
        set -euo pipefail
        python3 <<'PY'
        import fnmatch, json, os, subprocess

        PATTERNS = [
            "openapi/**",
            "**/controller/**",
            "**/Api*Controller.php",
            "config/routes.php",
            "**/*-definition-schema.json",
        ]
        ZERO_SHA = "0" * 40

        def path_matches(path: str, pattern: str) -> bool:
            path = path.replace("\\", "/").lstrip("./")
            pattern = pattern.replace("\\", "/")
            if "**" not in pattern:
                return fnmatch.fnmatchcase(path, pattern)
            if pattern.startswith("**/") and pattern.endswith("/**"):
                middle = pattern[3:-3]
                if middle:
                    return f"/{middle}/" in f"/{path}/" or path == middle or path.startswith(middle + "/")
                return True
            if "/**/" in pattern:
                left, right = pattern.split("/**/", 1)
                if path == left:
                    return fnmatch.fnmatchcase("", right) if right else True
                if not (path == left or path.startswith(left + "/")):
                    return False
                rest = path[len(left):].lstrip("/")
                parts = rest.split("/")
                for i in range(len(parts)):
                    if fnmatch.fnmatchcase("/".join(parts[i:]), right):
                        return True
                return False
            if pattern.endswith("/**"):
                prefix = pattern[:-3]
                return path == prefix or path.startswith(prefix + "/")
            if pattern.startswith("**/"):
                suffix = pattern[3:]
                if fnmatch.fnmatchcase(path, suffix):
                    return True
                parts = path.split("/")
                for i in range(len(parts)):
                    if fnmatch.fnmatchcase("/".join(parts[i:]), suffix):
                        return True
                return False
            return fnmatch.fnmatchcase(path, pattern)

        def matched_files(paths):
            matched = []
            for path in paths:
                path = path.strip()
                if not path:
                    continue
                for pattern in PATTERNS:
                    if path_matches(path, pattern):
                        matched.append(path)
                        break
            return matched

        def list_pr_filenames(repo, pr):
            # Prefer List pull request files: paginates and works for PRs with 300+ files.
            # `gh pr diff --name-only` uses the PR diff media type and fails with HTTP 406
            # (PullRequest.diff too_large) once GitHub's 300-file diff limit is exceeded.
            out = subprocess.check_output(
                [
                    "gh",
                    "api",
                    f"repos/{repo}/pulls/{pr}/files",
                    "--paginate",
                    "--jq",
                    ".[].filename",
                ],
                text=True,
            )
            return [line.strip() for line in out.splitlines() if line.strip()]

        def list_compare_filenames(repo, before, after):
            # Compare API returns at most 300 files and sets truncated=true beyond that.
            raw = subprocess.check_output(
                ["gh", "api", f"repos/{repo}/compare/{before}...{after}"],
                text=True,
            )
            data = json.loads(raw)
            if data.get("truncated"):
                return None
            files = data.get("files") or []
            return [f.get("filename", "").strip() for f in files if f.get("filename")]

        repo = os.environ["REPO"]
        pr = os.environ["PR"]
        event = os.environ["EVENT_NAME"]
        before = os.environ.get("BEFORE", "")
        use_full_pr_diff = event in ("opened", "reopened", "workflow_dispatch") or (event == "synchronize" and before in ("", ZERO_SHA))

        if use_full_pr_diff:
            files = list_pr_filenames(repo, pr)
        elif event == "synchronize":
            after = os.environ["AFTER"]
            files = list_compare_filenames(repo, before, after)
            if files is None:
                print("Compare result truncated (>300 files); falling back to full PR file list for scope.")
                files = list_pr_filenames(repo, pr)
        else:
            print(f"Unknown event {event!r}; using full PR file list for scope.")
            files = list_pr_filenames(repo, pr)

        matched = matched_files(files)
        should_run = bool(matched)
        print(f"Event: {event}")
        print(f"Files considered: {len(files)}")
        print(f"matched_files={json.dumps(matched)}")
        if should_run:
            print("API-relevant changes detected; running compliance check.")
        else:
            print("No API-relevant changes; skipping compliance check.")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh:
            gh.write(f"should_run={'true' if should_run else 'false'}\n")
            gh.write(f"matched_files={json.dumps(matched)}\n")
        PY

    - name: Export PR diff artifacts
      if: steps.scope.outputs.should_run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        MATCHED_FILES: ${{ steps.scope.outputs.matched_files }}
      run: |
        set -euo pipefail
        # Always list files via the paginated Files API (works for 300+ file PRs).
        gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > changed-files.txt
        # Full unified diff still preferred when GitHub can serve it.
        if gh pr diff "$PR" --repo "$REPO" > pr-diff.patch 2>pr-diff.err; then
          rm -f pr-diff.err
          exit 0
        fi
        if ! grep -Eqi 'too_large|maximum number of files|HTTP 406' pr-diff.err; then
          cat pr-diff.err >&2
          exit 1
        fi
        echo "Full PR diff unavailable (too large); building patch from List pull request files for API-relevant paths only."
        MATCHED_FILES="$MATCHED_FILES" REPO="$REPO" PR="$PR" python3 <<'PY'
        import json, os, subprocess, sys

        repo, pr = os.environ["REPO"], os.environ["PR"]
        matched = set(json.loads(os.environ.get("MATCHED_FILES") or "[]"))
        if not matched:
            print("No matched files to export after too_large diff.", file=sys.stderr)
            sys.exit(1)

        files = []
        page = 1
        while True:
            out = subprocess.check_output(
                ["gh", "api", f"repos/{repo}/pulls/{pr}/files?per_page=100&page={page}"],
                text=True,
            )
            chunk = json.loads(out)
            if not chunk:
                break
            files.extend(chunk)
            if len(chunk) < 100:
                break
            page += 1

        parts = [
            "[diff reconstructed from pull request files API because the full PR diff exceeded GitHub's 300-file limit; only API-relevant paths are included]",
            "",
        ]
        included = 0
        for entry in files:
            name = entry.get("filename") or ""
            if name not in matched:
                continue
            patch = entry.get("patch")
            status = entry.get("status") or "modified"
            prev = entry.get("previous_filename") or name
            if patch is None:
                parts.append(f"diff --git a/{prev} b/{name}")
                parts.append(f"# no patch available (status={status}; binary or too large)")
                parts.append("")
                included += 1
                continue
            parts.append(f"diff --git a/{prev} b/{name}")
            if status == "added":
                parts.append("--- /dev/null")
                parts.append(f"+++ b/{name}")
            elif status == "removed":
                parts.append(f"--- a/{prev}")
                parts.append("+++ /dev/null")
            else:
                parts.append(f"--- a/{prev}")
                parts.append(f"+++ b/{name}")
            parts.append(patch)
            parts.append("")
            included += 1

        if included == 0:
            print("Matched files had no entries in pull request files API response.", file=sys.stderr)
            sys.exit(1)

        with open("pr-diff.patch", "w", encoding="utf-8") as f:
            f.write("\n".join(parts))
        print(f"Wrote reconstructed patch for {included} API-relevant file(s).")
        PY

    - name: Truncate very large diffs
      if: steps.scope.outputs.should_run == 'true'
      shell: bash
      run: |
        set -euo pipefail
        limit=400000
        size=$(wc -c < pr-diff.patch | tr -d ' ')
        if [ "$size" -gt "$limit" ]; then
          head -c "$limit" pr-diff.patch > pr-diff.truncated.patch
          mv pr-diff.truncated.patch pr-diff.patch
          {
            echo ""
            echo "[diff truncated at ${limit} bytes for agent context; missing lines may hide violations — do not assume compliance solely from visible content]"
          } >> pr-diff.patch
        fi

    - name: Build webhook payload
      if: steps.scope.outputs.should_run == 'true'
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        API_DOCUMENTATION_REPO: ${{ inputs.API_DOCUMENTATION_REPO }}
        API_DOCUMENTATION_BRANCH: ${{ inputs.API_DOCUMENTATION_BRANCH }}
      run: |
        set -euo pipefail
        python3 <<'PY'
        import json, os, pathlib
        diff = pathlib.Path("pr-diff.patch").read_text(encoding="utf-8", errors="replace")
        files = [line.strip() for line in pathlib.Path("changed-files.txt").read_text(encoding="utf-8").splitlines() if line.strip()]
        payload = {
            "workflow": "api-docs-compliance-cursor-automation",
            "repository": os.environ["REPOSITORY"],
            "pr_number": int(os.environ["PR_NUMBER"]),
            "pr_url": os.environ["PR_URL"],
            "head_ref": os.environ["HEAD_REF"],
            "head_sha": os.environ["HEAD_SHA"],
            "base_ref": os.environ["BASE_REF"],
            "changed_files": files,
            "diff": diff,
            "api_documentation_repo": os.environ["API_DOCUMENTATION_REPO"],
            "api_documentation_branch": os.environ["API_DOCUMENTATION_BRANCH"],
        }
        pathlib.Path("webhook-payload.json").write_text(json.dumps(payload), encoding="utf-8")
        PY

    - name: Trigger Cursor API docs compliance automation
      if: steps.scope.outputs.should_run == 'true'
      shell: bash
      env:
        API_DOCS_COMPLIANCE_WEBHOOK_URL: ${{ inputs.API_DOCS_COMPLIANCE_WEBHOOK_URL }}
        API_DOCS_COMPLIANCE_WEBHOOK_TOKEN: ${{ inputs.API_DOCS_COMPLIANCE_WEBHOOK_TOKEN }}
      run: |
        set -euo pipefail
        http_code="$(curl -sS -o /tmp/webhook-response.txt -w "%{http_code}" -X POST "$API_DOCS_COMPLIANCE_WEBHOOK_URL" \
          -H "Authorization: Bearer $API_DOCS_COMPLIANCE_WEBHOOK_TOKEN" \
          -H "Content-Type: application/json" \
          --data-binary @webhook-payload.json)"
        if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
          echo "Webhook returned HTTP ${http_code}:" >&2
          cat /tmp/webhook-response.txt >&2 || true
          exit 1
        fi
        cat /tmp/webhook-response.txt

    - name: Wait for automation review and parse compliance
      if: steps.scope.outputs.should_run == 'true'
      id: parse
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PYTHONUTF8: "1"
      run: |
        set -euo pipefail
        python3 <<'PY'
        import json, os, re, subprocess, sys, time

        repo, pr = os.environ["REPO"], os.environ["PR"]
        head_sha = os.environ["HEAD_SHA"]
        deadline = time.time() + 10 * 60
        pattern = re.compile(r"<!-- api-docs-compliance:(.*?) -->", re.DOTALL)
        trigger_after = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

        def fetch_reviews():
            out = subprocess.check_output(
                ["gh", "api", f"repos/{repo}/pulls/{pr}/reviews", "--paginate"],
                text=True,
            )
            return json.loads(out)

        while time.time() < deadline:
            for review in reversed(fetch_reviews()):
                user = (review.get("user") or {}).get("login", "")
                if user not in ("cursor[bot]", "cursor"):
                    continue
                body = review.get("body") or ""
                match = pattern.search(body)
                if not match:
                    continue
                submitted = review.get("submitted_at") or ""
                if submitted < trigger_after:
                    continue
                data = json.loads(match.group(1), strict=False)
                if data.get("head_sha") not in (None, head_sha):
                    continue
                compliant = data.get("compliant")
                if not isinstance(compliant, bool):
                    print(f"Invalid compliant flag: {compliant!r}", file=sys.stderr)
                    sys.exit(1)
                with open("compliance.json", "w", encoding="utf-8") as f:
                    json.dump(data, f, ensure_ascii=False, indent=2)
                with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh:
                    gh.write(f"compliant={'true' if compliant else 'false'}\n")
                    gh.write(f"marker_review_id={review.get('id', '')}\n")
                    gh.write(f"marker_review_node_id={review.get('node_id', '')}\n")
                print(f"Parsed compliance review submitted_at={submitted} compliant={compliant}")
                sys.exit(0)
            time.sleep(10)

        print("Timed out after 10 minutes waiting for cursor[bot] api-docs-compliance marker", file=sys.stderr)
        sys.exit(1)
        PY

    - name: Clear previous API spec compliance comments
      if: steps.scope.outputs.should_run == 'true'
      uses: aki77/delete-pr-comments-action@v3
      with:
        token: ${{ github.token }}
        pullRequestNumber: ${{ github.event.pull_request.number }}
        includeIssueComments: 'true'
        includeOverallReviewComments: 'true'
        bodyContains: |-
          API spec review
          API Documentation Compliance
        usernames: |-
          cartoncloud-robot
          github-actions[bot]

    - name: Create pull request review when violations found
      if: steps.scope.outputs.should_run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUM: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        COMPLIANT="${{ steps.parse.outputs.compliant }}"
        if [ "$COMPLIANT" = "true" ]; then
          echo "API spec check passed (compliant). No review posted."
          exit 0
        fi
        python3 <<'PY'
        import json, pathlib, subprocess, sys

        with open("compliance.json", encoding="utf-8") as f:
            data = json.load(f)

        report = str(data.get("report") or "").strip()
        prefix = "**API spec review (API Documentation Compliance).** Resolve this conversation when all findings below are addressed.\n\n"
        if not report:
            body = "**API spec review (API Documentation Compliance).** Contract review reported non-compliance but produced no report text. This may indicate agent timeout, no matching changed files, or an automation error. Please check the workflow logs and re-run if needed."
        else:
            body = prefix + report

        pathlib.Path("/tmp/review-body.txt").write_text(body, encoding="utf-8")
        review = {"event": "COMMENT", "body": body}
        pathlib.Path("/tmp/review.json").write_text(json.dumps(review), encoding="utf-8")
        PY
        gh api "repos/${{ github.repository }}/pulls/$PR_NUM/reviews" --method POST --input /tmp/review.json
        echo "Pull request review posted (body-only; avoids GitHub 422 on unresolved line)."

    - name: Remove bot marker reviews and comments
      if: always() && steps.scope.outputs.should_run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        MARKER_REVIEW_ID: ${{ steps.parse.outputs.marker_review_id }}
        MARKER_REVIEW_NODE_ID: ${{ steps.parse.outputs.marker_review_node_id }}
      run: |
        set +euo pipefail
        python3 <<'PY'
        import json, os, re, subprocess, sys

        repo, pr = os.environ["REPO"], os.environ["PR"]
        marker = re.compile(r"<!-- api-docs-compliance:")
        cursor_users = {"cursor[bot]", "cursor"}
        parsed_review_id = (os.environ.get("MARKER_REVIEW_ID") or "").strip()
        parsed_node_id = (os.environ.get("MARKER_REVIEW_NODE_ID") or "").strip()

        def gh_json(args):
            out = subprocess.check_output(["gh", "api", *args], text=True)
            return json.loads(out)

        def minimize_review(node_id: str, label: str) -> bool:
            proc = subprocess.run(
                [
                    "gh", "api", "graphql", "-f",
                    f"query=mutation($subjectId: ID!) {{ minimizeComment(input: {{subjectId: $subjectId, classifier: OUTDATED}}) {{ minimizedComment {{ isMinimized }} }} }}",
                    f"subjectId={node_id}",
                ],
                capture_output=True,
                text=True,
            )
            if proc.returncode == 0:
                print(f"Minimized {label} {node_id}")
                return True
            print(proc.stderr.strip() or proc.stdout.strip(), file=sys.stderr)
            return False

        def remove_review(review_id: str, node_id: str, label: str) -> bool:
            if review_id:
                proc = subprocess.run(
                    ["gh", "api", "--method", "DELETE", f"repos/{repo}/pulls/{pr}/reviews/{review_id}"],
                    capture_output=True,
                    text=True,
                )
                if proc.returncode == 0:
                    print(f"Deleted {label} review {review_id}")
                    return True
            if node_id and minimize_review(node_id, label):
                return True
            return False

        if parsed_review_id or parsed_node_id:
            if not remove_review(parsed_review_id, parsed_node_id, "parsed cursor marker"):
                print(f"::warning::Could not remove parsed marker review {parsed_review_id}", file=sys.stderr)

        reviews = gh_json([f"repos/{repo}/pulls/{pr}/reviews", "--paginate"])
        for review in reviews:
            user = (review.get("user") or {}).get("login", "")
            body = review.get("body") or ""
            is_cursor_marker = user in cursor_users and marker.search(body)
            if not is_cursor_marker:
                continue
            review_id = str(review.get("id") or "")
            node_id = review.get("node_id") or ""
            if review_id and review_id == parsed_review_id:
                continue
            if not remove_review(review_id, node_id, "cursor marker"):
                print(f"::warning::Could not remove review {review_id} from {user}", file=sys.stderr)

        comments = gh_json([f"repos/{repo}/issues/{pr}/comments", "--paginate"])
        for comment in comments:
            user = (comment.get("user") or {}).get("login", "")
            if user not in cursor_users:
                continue
            body = comment.get("body") or ""
            if not marker.search(body):
                continue
            comment_id = comment.get("id")
            if not comment_id:
                continue
            proc = subprocess.run(
                ["gh", "api", "--method", "DELETE", f"repos/{repo}/issues/comments/{comment_id}"],
                capture_output=True,
                text=True,
            )
            if proc.returncode == 0:
                print(f"Deleted cursor issue comment {comment_id}")
            else:
                print(f"::warning::Could not delete cursor issue comment {comment_id}", file=sys.stderr)
        PY
