name: 'Slack Jira Release Notes'
description: 'Generate Slack release notes from a list of Jira issues'
inputs:
  title:
    description: 'Title for the release notes, i.e. React v1.2.3'
    required: false
  changelogFile:
    description: 'JSON file path with issues and other commits'
    required: false
    default: 'temp/changelog.json'
  slackToken:
    description: 'Slack Bot Token to use to find Slack users by email'
    required: true
  slackChannel:
    description: 'Slack channel id, channel name, or user id (output includes it as API field `channel` for `chat.postMessage`)'
    required: true

outputs:
  releaseNotes:
    description: 'Slack API payload for `chat.postMessage` (`text`, `blocks`, `channel`)'

runs:
  using: 'node24'
  main: 'dist/index.js'
